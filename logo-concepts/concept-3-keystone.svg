<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2A4A"/>
      <stop offset="1" stop-color="#081A30"/>
    </linearGradient>
    <linearGradient id="sh3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D426E"/>
      <stop offset="1" stop-color="#102944"/>
    </linearGradient>
    <linearGradient id="gold3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9C693"/>
      <stop offset="1" stop-color="#D4A574"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" ry="104" fill="url(#bg3)"/>

  <!-- Shield: wide rounded top, tapers to a rounded point at the bottom -->
  <path fill="url(#sh3)" stroke="#D4A574" stroke-width="6" stroke-linejoin="round" d="
    M 128 128
    Q 128 112 144 112
    L 368 112
    Q 384 112 384 128
    L 384 272
    Q 384 360 256 416
    Q 128 360 128 272
    Z"/>

  <!-- Three ascending bars inside the shield -->
  <rect x="172" y="288" width="40" height="64"  rx="6" fill="#D4A574"/>
  <rect x="236" y="256" width="40" height="96"  rx="6" fill="#E9C693"/>
  <rect x="300" y="216" width="40" height="136" rx="6" fill="#F8FAFC"/>

  <!-- Small accent mark at the top of the tallest bar -->
  <circle cx="320" cy="206" r="10" fill="#10B981"/>
</svg>
