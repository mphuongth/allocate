<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F2A4A"/>
      <stop offset="1" stop-color="#081A30"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" ry="104" fill="url(#bg)"/>

  <!-- Base row: two large pebbles -->
  <rect x="100" y="300" width="148" height="130" rx="38" fill="#3B5A82"/>
  <rect x="264" y="300" width="148" height="130" rx="38" fill="#163A61"/>
  <!-- Peak: one pebble, emerald for the summit -->
  <rect x="182" y="150" width="148" height="130" rx="38" fill="#10B981"/>
  <!-- Cream accent dot at the very top to read as a "marker stone" -->
  <circle cx="256" cy="120" r="14" fill="#F8FAFC"/>
</svg>
