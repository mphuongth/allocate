name: E2E

# Playwright lanes (#595).
#
#   smoke — ~19 high-value tests (auth, cross-user ownership, API validation,
#           the core transaction flow, one maturity/merge money path, the report
#           download, navigation). Called by CI on every pull request.
#   full  — the whole suite (~258 tests, ~7.6 min serial). Runs nightly and on
#           demand, never on the PR path.
#
# Both lanes run against a **local Supabase stack started inside the runner**,
# not the shared test project. That project is a NANO instance whose Disk IO
# budget could not sustain the suite (throttled, ~72 min, cascading failures),
# which is why E2E was pulled from CI in the first place (#313). A per-run local
# stack is isolated, fast, and free — and the production guard in
# e2e/helpers/guard.ts still refuses to run against production either way.

on:
  workflow_call:
    inputs:
      lane:
        description: 'smoke or full'
        type: string
        default: full
  workflow_dispatch:
    inputs:
      lane:
        description: 'Which lane to run'
        type: choice
        options: [full, smoke]
        default: full
  schedule:
    # 18:00 UTC = 01:00 Asia/Ho_Chi_Minh — the nightly full-suite run.
    - cron: '0 18 * * *'

jobs:
  e2e:
    name: E2E (${{ inputs.lane || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LANE: ${{ inputs.lane || 'full' }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Node 22 bundles npm 10, which rejects this lockfile — see the note in
      # ci.yml's Unit Tests job (#685).
      - name: Pin npm to the version that generated the lockfile
        run: npm i -g npm@11.12.1

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Start a local Supabase stack
        run: supabase start

      - name: Restore the hosted-project DML baseline
        # A hosted project grants anon/authenticated/service_role full DML on
        # `public` through default privileges, so the app's migrations carry no
        # GRANTs. The CLI's local stack grants only the non-DML part, so seeding
        # fails with `42501 permission denied for table …`. The script tops up
        # DML only for roles still present in an object's ACL, so migration-level
        # revocations survive it — see the comments in the file. Same script the
        # local setup in docs/e2e.md runs, so CI and local can't drift.
        run: npm run db:baseline

      - name: Point the app and the E2E setup at the local stack
        # `supabase status -o env` prints the local stack's URL and keys. These
        # are the CLI's well-known local development keys — not secrets.
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_SUPABASE_URL=$API_URL"
            echo "E2E_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Build the app
        run: npm run build

      # Two consecutive `main` runs stalled on this download and burned the job's
      # whole 30-minute budget. Because `Apply DB migrations (production)` needs
      # e2e-smoke, that skipped the migration push and left production serving
      # code against a schema without it (#696) — the failure ci.yml calls "the
      # one failure in this pipeline that does not heal on its own", reached by a
      # different road. Three changes: the cache means an ordinary run downloads
      # nothing, the step timeout turns a stall into a 6-minute failure instead of
      # a 30-minute one, and the retry means a single bad fetch does not need a
      # human to re-run the pipeline.
      - name: Resolve the Playwright version from the lockfile
        id: playwright
        run: |
          echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the browser cache
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Keyed by the resolved version, not a constant: a stale cache would
          # hand last month's browsers to this month's Playwright, which fails
          # when a test runs rather than when the browsers are installed.
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        # A backstop, not the mechanism. `timeout-minutes` kills the step's
        # PROCESS, so a stall on the first attempt would take the shell down and
        # the retry below would never start — the bound has to be around each
        # attempt. Set above two whole attempts (2 × 4m30s) so this never fires
        # during a retry.
        timeout-minutes: 12
        run: |
          # The cache holds the browsers, not the apt libraries they link
          # against, so the system deps are installed either way — restoring the
          # cache and skipping them gives a browser that cannot start.
          # -k, because `timeout` sends TERM and then waits: a child that traps
          # or blocks it outlives the bound entirely (measured on ubuntu:24.04 —
          # `timeout 3` against a TERM-ignoring child never returns, `timeout -k
          # 2s 3` returns 137 after 5s). Without the escalation the step-level
          # backstop kills the shell instead and the retry is skipped again.
          install_browsers() {
            if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
              timeout -k 30s 4m npx playwright install-deps chromium
            else
              timeout -k 30s 4m npx playwright install --with-deps chromium
            fi
          }
          # `timeout` exits 124 when it kills the attempt, which is a failure like
          # any other here: hand control to the retry rather than to the runner.
          install_browsers || {
            echo "browser install failed or stalled — retrying once"
            install_browsers
          }

      - name: Run the ${{ inputs.lane || 'full' }} lane
        run: |
          if [ "$LANE" = "smoke" ]; then
            npm run test:e2e:smoke
          else
            npm run test:e2e
          fi

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ inputs.lane || 'full' }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
